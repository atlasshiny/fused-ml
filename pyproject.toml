[project]
name = "fused-ml"
version = "1.0.0"
description = "Fused Triton RMSNorm with a hand-written forward and backward"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "torch==2.15.0",
    "triton==3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fused_ml"]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.pytest.ini_options]
testpaths = ["tests"]
